name: Web quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/premium-landing-estimator-20261014]

jobs:
  quality:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Estimator unit tests
        run: node --test tests/estimate.test.js

      - name: Production build
        run: npm run build
