name: Render Codday hero video assets (one-time)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/render-codday-hero.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-landing-estimator-20261014
          persist-credentials: true
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Retrieve approved illustration
        env:
          SOURCE_IMAGE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/fb6c2c08-47e2-4a29-a8db-f393a40f1624.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWU0ODc4ZDE0NmRjNzYyZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjEwNzcyOX0.qEPWN4tDoiRftxJr5suJUwo291nLEHiWOIBiin_Dbog'
        run: |
          curl --fail --location --silent --show-error --retry 3 "$SOURCE_IMAGE_URL" -o /tmp/approved-visual.png
          test $(wc -c < /tmp/approved-visual.png) -gt 100000
      - name: Export lightweight poster and looping motion clip
        run: |
          ffmpeg -hide_banner -loglevel error -y -i /tmp/approved-visual.png -vf "crop=1120:1120:60:60,scale=800:800:flags=lanczos" -frames:v 1 -c:v libwebp -quality 84 public/codday-hero-poster.webp
          ffmpeg -hide_banner -loglevel error -y -loop 1 -i public/codday-hero-poster.webp -vf "scale=760:760:flags=lanczos,zoompan=z='1.014+0.012*sin(on*2*PI/90)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=720x720:fps=15,format=yuv420p" -frames:v 90 -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -movflags +faststart -an public/codday-hero-loop.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/codday-hero-loop.mp4
      - name: Commit video and poster into project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/codday-hero-loop.mp4 public/codday-hero-poster.webp
          git commit -m "assets: ship compressed Codday illustrated hero film [skip ci]"
          git push origin HEAD:feat/premium-landing-estimator-20261014
